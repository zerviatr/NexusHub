[package]
name = "zendev"
version = "2.5.4"
description = "ZenDev — Premium Multi-Tool Desktop Application"
authors = ["ZenDev Team"]
edition = "2021"

[lib]
name = "zendev_tauri_lib"
crate-type = ["staticlib", "rlib"]
doctest = false



[[bin]]
name = "zendev"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-manifest = "1.5"


[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["simple"] }
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sysinfo = "0.33"

rfd = "0.15"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
url = "2.5"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
data-encoding = "2.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
x509-parser = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

